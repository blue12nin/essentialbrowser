<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshots — Essential Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="cursor"></div>
  <nav>
    <div class="nav-inner">
      <span class="nav-logo">essential<span class="highlight">browser</span></span>
      <div class="nav-links">
        <a href="whats-new.html">What's New</a>
        <a href="index.html" class="nav-btn">&#8592; Back</a>
      </div>
    </div>
  </nav>

  <section class="screenshots-page">
    <div class="screenshots-inner">
      <h1 class="screenshots-title">Screenshots</h1>
      <p class="screenshots-sub">A look at Essential Browser in action.</p>

      <div class="screenshot-grid">
        <div class="screenshot-card">
          <div class="screenshot-frame">
            <img src="screenshots/hero-section.png" alt="Hero Section" loading="lazy">
          </div>
          <p class="screenshot-label">Hero Section</p>
        </div>

        <div class="screenshot-card">
          <div class="screenshot-frame">
            <img src="screenshots/features-section.png" alt="Features Section" loading="lazy">
          </div>
          <p class="screenshot-label">Features</p>
        </div>

        <div class="screenshot-card">
          <div class="screenshot-frame">
            <img src="screenshots/download-section.png" alt="Download Section" loading="lazy">
          </div>
          <p class="screenshot-label">Download Section</p>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="footer-inner">
      <p>&copy; 2026 Essential Browser. All rights reserved.</p>
      <p class="footer-tag">built with focus</p>
    </div>
  </footer>
  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.screenshot-card').forEach(el => observer.observe(el));

    const cursor = document.querySelector('.cursor');
    let mx = 0, my = 0, cx = 0, cy = 0;
    document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
    function animCursor() {
      cx += (mx - cx) * 0.12;
      cy += (my - cy) * 0.12;
      cursor.style.left = `${cx - 8}px`;
      cursor.style.top = `${cy - 8}px`;
      requestAnimationFrame(animCursor);
    }
    animCursor();
    document.querySelectorAll('a, button, .screenshot-card, .nav-btn').forEach(el => {
      el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
      el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
    });
  </script>
</body>
</html>

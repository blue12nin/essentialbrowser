<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshots — Essential Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="cursor"></div>
  <div id="lightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-img" src="" alt="">
  </div>
  <nav>
    <div class="nav-inner">
      <span class="nav-logo">essential<span class="highlight">browser</span></span>
      <div class="nav-links">
        <a href="whats-new.html">What's New</a>
        <a href="index.html" class="nav-btn">&#8592; Back</a>
      </div>
    </div>
  </nav>

  <section class="screenshots-page">
    <div class="screenshots-inner">
      <h1 class="screenshots-title">Screenshots</h1>
      <p class="screenshots-sub">Click any image to expand.</p>

      <div class="screenshot-grid">
        <div class="screenshot-card">
          <div class="screenshot-frame">
            <img src="screenshots/Screenshot 2026-07-30 155601.png" alt="Screenshot 1" loading="lazy">
          </div>
          <p class="screenshot-label">Screenshot 1</p>
        </div>

        <div class="screenshot-card">
          <div class="screenshot-frame">
            <img src="screenshots/Screenshot 2026-07-30 155610.png" alt="Screenshot 2" loading="lazy">
          </div>
          <p class="screenshot-label">Screenshot 2</p>
        </div>

        <div class="screenshot-card">
          <div class="screenshot-frame">
            <img src="screenshots/Screenshot 2026-07-30 155642.png" alt="Screenshot 3" loading="lazy">
          </div>
          <p class="screenshot-label">Screenshot 3</p>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="footer-inner">
      <p>&copy; 2026 Essential Browser. All rights reserved.</p>
      <p class="footer-tag">built with focus</p>
    </div>
  </footer>
  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.screenshot-card').forEach(el => observer.observe(el));

    const cursor = document.querySelector('.cursor');
    let mx = 0, my = 0, cx = 0, cy = 0;
    document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
    function animCursor() {
      cx += (mx - cx) * 0.12;
      cy += (my - cy) * 0.12;
      cursor.style.left = `${cx - 8}px`;
      cursor.style.top = `${cy - 8}px`;
      requestAnimationFrame(animCursor);
    }
    animCursor();
    document.querySelectorAll('a, button, .screenshot-card, .nav-btn').forEach(el => {
      el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
      el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
    });

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = lightbox.querySelector('.lightbox-img');
    document.querySelectorAll('.screenshot-frame').forEach(frame => {
      frame.addEventListener('click', () => {
        lightboxImg.src = frame.querySelector('img').src;
        lightboxImg.alt = frame.querySelector('img').alt;
        lightbox.classList.add('open');
      });
    });
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox || e.target.classList.contains('lightbox-close')) {
        lightbox.classList.remove('open');
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') lightbox.classList.remove('open');
    });
  </script>
</body>
</html>
